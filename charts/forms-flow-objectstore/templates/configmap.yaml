{{- $name := include "forms-flow-objectstore.name" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "forms-flow-objectstore.labels" (dict "name" $name "component" "objectstore" "context" $) | nindent 4 }}
data:
  # Prometheus counts: "public" while the store is reachable inside the
  # cluster only; "jwt" where the network is shared.
  MINIO_PROMETHEUS_AUTH_TYPE: {{ .Values.metricsAuth | quote }}

{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
{{- $name := include "forms-flow-queue.name" . }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "forms-flow-queue.labels" (dict "name" $name "component" "queue" "context" $) | nindent 4 }}
  annotations:
    # Keep the stored forms when the release is removed.
    helm.sh/resource-policy: keep
spec: {{- include "forms-flow-queue.pvcSpec" (dict "persistence" .Values.persistence "context" $) | nindent 2 }}
{{- end }}

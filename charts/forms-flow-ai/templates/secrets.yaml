apiVersion: v1
kind: Secret
metadata:
  labels:
    app: "{{ .Chart.Name }}"
  name: "{{ .Chart.Name }}"
stringData:
  FORMIO_ROOT_EMAIL: {{ index .Values "forms-flow-forms" "admin" "email" }}
  FORMIO_ROOT_PASSWORD: {{ index .Values "forms-flow-forms" "admin" "password" }}
  FORMIO_JWT_SECRET: "{{ .Release.Namespace }}-jwt-secret" 
  KEYCLOAK_CLIENTID: {{ index .Values "forms-flow-bpm" "clientid" }}
  KEYCLOAK_CLIENTSECRET: {{ index .Values "forms-flow-bpm" "clientsecret" }}
  WEB_CLIENTID: {{ index .Values "forms-flow-web" "clientid" }}
  WEBSOCKET_ENCRYPT_KEY: "{{ .Values.websocket_encrypt_key }}"
  ADMIN_WEB_CLIENTID: {{ index .Values "forms-flow-web" "clientid" }}
  INSIGHT_API_KEY:  "{{ .Values.insight_api_key }}"
  REDIS_PASSCODE: "{{ .Values.redis_pass_code }}"
  IPAAS_EMBEDDED_API_KEY: "{{ .Values.ipaas.embedded_api_key }}"
  IPAAS_JWT_PRIVATE_KEY: "{{ .Values.ipaas.jwt_private_key }}"
  FORMIO_DB_NAME: "{{ .Values.mongodb.auth.databases | first }}"
  {{- if .Values.mongodb.enabled }} 
  NODE_CONFIG: '{"mongo":"mongodb://{{ .Values.mongodb.auth.usernames | first }}:{{ .Values.mongodb.auth.passwords | first }}@{{ .Values.mongodb.service.nameOverride }}:{{ .Values.mongodb.service.ports.mongodb }}/{{ .Values.mongodb.auth.databases | first }}"}'
  MONGODB_URI:  {{ tpl "mongodb://{{ .Values.mongodb.auth.usernames | first }}:{{ .Values.mongodb.auth.passwords | first }}@{{ .Values.mongodb.service.nameOverride }}:{{ .Values.mongodb.service.ports.mongodb }}/{{ .Values.mongodb.auth.databases | first }}" . }}
  {{- else }}
  MONGODB_URI:  {{ tpl "mongodb+srv://{{ .Values.mongodb.auth.usernames | first }}:{{ .Values.mongodb.auth.passwords | first }}@{{ .Values.mongodb.service.nameOverride }}/{{ .Values.mongodb.auth.databases | first }}" . }} 
  NODE_CONFIG: '{"mongo":"mongodb+srv://{{ .Values.mongodb.auth.usernames | first }}:{{ .Values.mongodb.auth.passwords | first }}@{{ .Values.mongodb.service.nameOverride }}/{{ .Values.mongodb.auth.databases | first }}"}'
  {{- end }}
  OPENAI_API_KEY: {{ .Values.openai.apiKey }}
  # Offline forms: each password is used by two components (the queue or
  # store, and its client), so it lives here once, under that component's values.
  OFFLINE_NATS_SETUP_PASSWORD: {{ index .Values "forms-flow-queue" "setupPassword" | quote }}
  OFFLINE_NATS_BRIDGE_PASSWORD: {{ index .Values "forms-flow-bridge" "natsPassword" | quote }}
  OFFLINE_NATS_WORKER_PASSWORD: {{ index .Values "forms-flow-offline-worker" "natsPassword" | quote }}
  OFFLINE_NATS_VIEWER_PASSWORD: {{ index .Values "forms-flow-queue-ui" "natsPassword" | quote }}
  OFFLINE_STORE_ROOT_PASSWORD: {{ index .Values "forms-flow-objectstore" "rootPassword" | quote }}
  OFFLINE_STORE_BRIDGE_SECRET: {{ index .Values "forms-flow-bridge" "storeSecret" | quote }}
  OFFLINE_STORE_WORKER_SECRET: {{ index .Values "forms-flow-offline-worker" "storeSecret" | quote }}

# forms-flow-offline-worker: takes forms from the queue and saves them with
# the API's code, so it gets forms-flow-api's settings (forms-flow-ai and
# forms-flow-api ConfigMaps/Secrets) plus its own. Starts after the init Jobs.
apiVersion: {{ include "common.capabilities.deployment.apiVersion" . }}
kind: Deployment
metadata:
  name: {{ include "common.names.fullname" . }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: offline-worker
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  {{- $podLabels := include "common.tplvalues.merge" ( dict "values" ( list .Values.podLabels .Values.commonLabels ) "context" . ) }}
  selector:
    matchLabels: {{- include "common.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 6 }}
  replicas: {{ .Values.replicaCount }}
  strategy: {{- include "common.tplvalues.render" (dict "value" .Values.updateStrategy "context" $ ) | nindent 4 }}
  template:
    metadata:
      labels: {{- include "common.labels.standard" ( dict "customLabels" $podLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: offline-worker
      annotations:
        checksum/configuration: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secrets: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- if .Values.podAnnotations }}
        {{- include "common.tplvalues.render" (dict "value" .Values.podAnnotations "context" $) | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "forms-flow-offline-worker.serviceAccountName" . }}
      {{- include "forms-flow-offline-worker.imagePullSecrets" . | nindent 6 }}
      automountServiceAccountToken: {{ .Values.automountServiceAccountToken }}
      {{- if .Values.hostAliases }}
      hostAliases: {{- include "common.tplvalues.render" (dict "value" .Values.hostAliases "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.affinity }}
      affinity: {{- include "common.tplvalues.render" (dict "value" .Values.affinity "context" $) | nindent 8 }}
      {{- else }}
      affinity:
        podAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAffinityPreset "component" "offline-worker" "customLabels" $podLabels "context" $) | nindent 10 }}
        podAntiAffinity: {{- include "common.affinities.pods" (dict "type" .Values.podAntiAffinityPreset "component" "offline-worker" "customLabels" $podLabels "context" $) | nindent 10 }}
        nodeAffinity: {{- include "common.affinities.nodes" (dict "type" .Values.nodeAffinityPreset.type "key" .Values.nodeAffinityPreset.key "values" .Values.nodeAffinityPreset.values) | nindent 10 }}
      {{- end }}
      {{- if .Values.nodeSelector }}
      nodeSelector: {{- include "common.tplvalues.render" (dict "value" .Values.nodeSelector "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.tolerations }}
      tolerations: {{- include "common.tplvalues.render" (dict "value" .Values.tolerations "context" $) | nindent 8 }}
      {{- end }}
      {{- if .Values.schedulerName }}
      schedulerName: {{ .Values.schedulerName }}
      {{- end }}
      {{- if .Values.topologySpreadConstraints }}
      topologySpreadConstraints: {{- include "common.tplvalues.render" (dict "value" .Values.topologySpreadConstraints "context" .) | nindent 8 }}
      {{- end }}
      {{- if .Values.priorityClassName }}
      priorityClassName: {{ .Values.priorityClassName | quote }}
      {{- end }}
      {{- if .Values.terminationGracePeriodSeconds }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- end }}
      {{- if .Values.podSecurityContext.enabled }}
      securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.podSecurityContext "context" $) | nindent 8 }}
      {{- end }}
      {{- $waitForInitJobs := include "forms-flow-offline-worker.waitForInitJobs" . }}
      {{- if or $waitForInitJobs .Values.initContainers }}
      initContainers:
        {{- with $waitForInitJobs }}
        {{- . | nindent 8 }}
        {{- end }}
        {{- if .Values.initContainers }}
        {{- include "common.tplvalues.render" (dict "value" .Values.initContainers "context" $) | nindent 8 }}
        {{- end }}
      {{- end }}
      containers:
        - name: forms-flow-offline-worker
          image: {{ include "forms-flow-offline-worker.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
          {{- if .Values.containerSecurityContext.enabled }}
          securityContext: {{- include "common.compatibility.renderSecurityContext" (dict "secContext" .Values.containerSecurityContext "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
          {{- else if .Values.command }}
          command: {{- include "common.tplvalues.render" (dict "value" .Values.command "context" $) | nindent 12 }}
          {{- else }}
          command: ["python", "-m", "formsflow_api.offline_consumer"]
          {{- end }}
          {{- if .Values.diagnosticMode.enabled }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
          {{- else if .Values.args }}
          args: {{- include "common.tplvalues.render" (dict "value" .Values.args "context" $) | nindent 12 }}
          {{- end }}
          {{- if .Values.lifecycleHooks }}
          lifecycle: {{- include "common.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
          {{- end }}
          env:
          # --- As forms-flow-api (its chart's env) ---
          - name: MONGODB_URI
            valueFrom:
              secretKeyRef:
                key: MONGODB_URI
                name: "{{ .Values.formsflow.secret }}"
          # Process engine calls go through forms-flow-process-gateway.
          - name: BPM_API_URL
            valueFrom:
              configMapKeyRef:
                key: PROCESS_GATEWAY_SERVICE_URL
                name: "{{ .Values.formsflow.configmap }}"
          - name: BPM_API_URL_PREFIX
            valueFrom:
              configMapKeyRef:
                key: BPM_API_URL_PREFIX
                name: "{{ .Values.formsflow.configmap }}"
          - name: BPM_CLIENT_ID
            valueFrom:
              secretKeyRef:
                key: KEYCLOAK_CLIENTID
                name: "{{ .Values.formsflow.secret }}"
          - name: BPM_CLIENT_SECRET
            valueFrom:
              secretKeyRef:
                key: KEYCLOAK_CLIENTSECRET
                name: "{{ .Values.formsflow.secret }}"
          - name: BPM_TOKEN_API
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_TOKEN_URL
                name: "{{ .Values.formsflow.configmap }}"
          # The API's database (forms-flow-api Secret/ConfigMap).
          {{- with .Values.api.database }}
          - name: DATABASE_NAME
            valueFrom:
              secretKeyRef:
                key: {{ .nameKey }}
                name: "{{ $.Values.api.secret }}"
          - name: DATABASE_PASSWORD
            valueFrom:
              secretKeyRef:
                key: {{ .passwordKey }}
                name: "{{ $.Values.api.secret }}"
          - name: DATABASE_USERNAME
            valueFrom:
              secretKeyRef:
                key: {{ .userKey }}
                name: "{{ $.Values.api.secret }}"
          - name: DATABASE_PORT
            valueFrom:
              configMapKeyRef:
                key: {{ .portKey }}
                name: "{{ $.Values.api.configmap }}"
          - name: DATABASE_HOST
            valueFrom:
              secretKeyRef:
                key: {{ .hostKey }}
                name: "{{ $.Values.api.secret }}"
          {{- end }}
          - name: JWT_OIDC_ALGORITHMS
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_JWT_OIDC_ALGORITHMS
                name: "{{ .Values.formsflow.configmap }}"
          - name: JWT_OIDC_AUDIENCE
            valueFrom:
              secretKeyRef:
                key: WEB_CLIENTID
                name: "{{ .Values.formsflow.secret }}"
          - name: JWT_OIDC_CACHING_ENABLED
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_JWT_OIDC_CACHING_ENABLED
                name: "{{ .Values.formsflow.configmap }}"
          - name: JWT_OIDC_ISSUER
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_JWT_OIDC_ISSUER
                name: "{{ .Values.formsflow.configmap }}"
          - name: JWT_OIDC_JWKS_CACHE_TIMEOUT
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_JWT_OIDC_JWKS_CACHE_TIMEOUT
                name: "{{ .Values.formsflow.configmap }}"
          - name: JWT_OIDC_JWKS_URI
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_JWT_OIDC_JWKS_URI
                name: "{{ .Values.formsflow.configmap }}"
          - name: JWT_OIDC_WELL_KNOWN_CONFIG
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_JWT_OIDC_CONFIG
                name: "{{ .Values.formsflow.configmap }}"
          - name: KEYCLOAK_URL
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_URL
                name: "{{ .Values.formsflow.configmap }}"
          - name: WEB_API_BASE_URL
            valueFrom:
              configMapKeyRef:
                key: WEB_API_SERVICE_URL
                name: "{{ .Values.formsflow.configmap }}"
          - name: KEYCLOAK_URL_REALM
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_URL_REALM
                name: "{{ .Values.formsflow.configmap }}"
          - name: INSIGHT_API_URL
            valueFrom:
              configMapKeyRef:
                key: INSIGHT_API_URL
                name: "{{ .Values.formsflow.configmap }}"
          - name: INSIGHT_API_KEY
            valueFrom:
              secretKeyRef:
                key: INSIGHT_API_KEY
                name: "{{ .Values.formsflow.secret }}"
          - name: KEYCLOAK_ENABLE_CLIENT_AUTH
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_ENABLE_CLIENT_AUTH
                name: "{{ .Values.formsflow.configmap }}"
          - name: MULTI_TENANCY_ENABLED
            valueFrom:
              configMapKeyRef:
                key: MULTI_TENANCY_ENABLED
                name: "{{ .Values.formsflow.configmap }}"
          - name: FORMSFLOW_ADMIN_URL
            valueFrom:
              configMapKeyRef:
                key: FORMSFLOW_ADMIN_SERVICE_URL
                name: "{{ .Values.formsflow.configmap }}"
          - name: FORMIO_URL
            valueFrom:
              configMapKeyRef:
                key: FORMIO_URL
                name: "{{ .Values.formsflow.configmap }}"
          - name: FORMIO_ROOT_EMAIL
            valueFrom:
              secretKeyRef:
                key: FORMIO_ROOT_EMAIL
                name: "{{ .Values.formsflow.secret }}"
          - name: FORMIO_ROOT_PASSWORD
            valueFrom:
              secretKeyRef:
                key: FORMIO_ROOT_PASSWORD
                name: "{{ .Values.formsflow.secret }}"
          - name: FORMIO_JWT_SECRET
            valueFrom:
              secretKeyRef:
                key: FORMIO_JWT_SECRET
                name: "{{ .Values.formsflow.secret }}"
          - name: IPAAS_EMBEDDED_API_KEY
            valueFrom:
              secretKeyRef:
                key: IPAAS_EMBEDDED_API_KEY
                name: "{{ .Values.formsflow.secret }}"
          - name: IPAAS_JWT_PRIVATE_KEY
            valueFrom:
              secretKeyRef:
                key: IPAAS_JWT_PRIVATE_KEY
                name: "{{ .Values.formsflow.secret }}"
          - name: IPAAS_EMBED_BASE_URL
            valueFrom:
              configMapKeyRef:
                key: IPAAS_EMBED_BASE_URL
                name: "{{ .Values.formsflow.configmap }}"
          - name: IPAAS_API_BASE_URL
            valueFrom:
              configMapKeyRef:
                key: IPAAS_API_BASE_URL
                name: "{{ .Values.formsflow.configmap }}"
          - name: REDIS_URL
            valueFrom:
              configMapKeyRef:
                key: REDIS_URL
                name: "{{ .Values.formsflow.configmap }}"
          - name: CONFIGURE_LOGS
            valueFrom:
              configMapKeyRef:
                key: CONFIGURE_LOGS
                name: "{{ .Values.formsflow.configmap }}"
          - name: KEYCLOAK_URL_HTTP_RELATIVE_PATH
            valueFrom:
              configMapKeyRef:
                key: KEYCLOAK_URL_HTTP_RELATIVE_PATH
                name: "{{ .Values.formsflow.configmap }}"
          - name: USER_NAME_DISPLAY_CLAIM
            valueFrom:
              configMapKeyRef:
                key: USER_NAME_DISPLAY_CLAIM
                name: "{{ .Values.formsflow.configmap }}"
          - name: FORMIO_JWT_EXPIRE
            valueFrom:
              configMapKeyRef:
                key: FORMIO_JWT_EXPIRE
                name: "{{ .Values.api.configmap }}"
          - name: OPENAI_API_KEY
            valueFrom:
              secretKeyRef:
                key: OPENAI_API_KEY
                name: "{{ .Values.formsflow.secret }}"
          - name: AI_FORM_GENERATION_LIMIT_TRIAL
            valueFrom:
              configMapKeyRef:
                key: AI_FORM_GENERATION_LIMIT_TRIAL
                name: "{{ .Values.formsflow.configmap }}"
          - name: AI_FORM_GENERATION_LIMIT_PAID
            valueFrom:
              configMapKeyRef:
                key: AI_FORM_GENERATION_LIMIT_PAID
                name: "{{ .Values.formsflow.configmap }}"
          - name: AI_BUILDER_QUOTA_TIMEZONE
            valueFrom:
              configMapKeyRef:
                key: AI_BUILDER_QUOTA_TIMEZONE
                name: "{{ .Values.formsflow.configmap }}"
          # --- Offline settings shared with the API and others (forms-flow-ai) ---
          - name: OFFLINE_ENABLED
            valueFrom:
              configMapKeyRef:
                key: OFFLINE_ENABLED
                name: "{{ .Values.formsflow.configmap }}"
          - name: OFFLINE_AUTO_SYNC_ENABLED
            valueFrom:
              configMapKeyRef:
                key: OFFLINE_AUTO_SYNC_ENABLED
                name: "{{ .Values.formsflow.configmap }}"
          - name: OFFLINE_CUSTOM_SUBMISSION_ENABLED
            valueFrom:
              configMapKeyRef:
                key: OFFLINE_CUSTOM_SUBMISSION_ENABLED
                name: "{{ .Values.formsflow.configmap }}"
          - name: OFFLINE_WORKER_CLIENT_ID
            valueFrom:
              configMapKeyRef:
                key: OFFLINE_WORKER_CLIENT_ID
                name: "{{ .Values.formsflow.configmap }}"
          - name: OFFLINE_WORKER_KEY_ID
            valueFrom:
              configMapKeyRef:
                key: OFFLINE_WORKER_KEY_ID
                name: "{{ .Values.formsflow.configmap }}"
          - name: OFFLINE_TRACE_ENABLED
            valueFrom:
              configMapKeyRef:
                key: OFFLINE_TRACE_ENABLED
                name: "{{ .Values.formsflow.configmap }}"
          - name: OFFLINE_QUEUE_MAX_HOURS
            valueFrom:
              configMapKeyRef:
                key: OFFLINE_QUEUE_MAX_HOURS
                name: "{{ .Values.formsflow.configmap }}"
          - name: OFFLINE_QUEUE_MAX_WAIT_DAYS
            valueFrom:
              configMapKeyRef:
                key: OFFLINE_QUEUE_MAX_WAIT_DAYS
                name: "{{ .Values.formsflow.configmap }}"
          - name: OFFLINE_STORE_BUCKET
            valueFrom:
              configMapKeyRef:
                key: OFFLINE_STORE_BUCKET
                name: "{{ .Values.formsflow.configmap }}"
          - name: OFFLINE_STORE_ENDPOINT_URL
            valueFrom:
              configMapKeyRef:
                key: OFFLINE_STORE_ENDPOINT_URL
                name: "{{ .Values.formsflow.configmap }}"
          - name: OFFLINE_STORE_REGION
            valueFrom:
              configMapKeyRef:
                key: OFFLINE_STORE_REGION
                name: "{{ .Values.formsflow.configmap }}"
          - name: NATS_URL
            valueFrom:
              configMapKeyRef:
                key: OFFLINE_NATS_URL
                name: "{{ .Values.formsflow.configmap }}"
          - name: NATS_PASSWORD
            valueFrom:
              secretKeyRef:
                key: OFFLINE_NATS_WORKER_PASSWORD
                name: "{{ .Values.formsflow.secret }}"
          - name: OFFLINE_STORE_SECRET_KEY
            valueFrom:
              secretKeyRef:
                key: OFFLINE_STORE_WORKER_SECRET
                name: "{{ .Values.formsflow.secret }}"
          # The app link for task links and emails.
          - name: WEB_BASE_URL
            valueFrom:
              configMapKeyRef:
                key: FORMSFLOW_WEB_URL
                name: "{{ .Values.formsflow.configmap }}"
          {{- if .Values.extraEnvVars }}
          {{- include "common.tplvalues.render" (dict "value" .Values.extraEnvVars "context" $) | nindent 10 }}
          {{- end }}
          envFrom:
            - configMapRef:
                name: {{ include "common.names.fullname" . }}
            - secretRef:
                name: {{ .Values.existingSecret | default (include "common.names.fullname" .) }}
            {{- if .Values.extraEnvVarsCM }}
            - configMapRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsCM "context" $) }}
            {{- end }}
            {{- if .Values.extraEnvVarsSecret }}
            - secretRef:
                name: {{ include "common.tplvalues.render" (dict "value" .Values.extraEnvVarsSecret "context" $) }}
            {{- end }}
          {{- if .Values.resources }}
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- else if ne .Values.resourcesPreset "none" }}
          resources: {{- include "common.resources.preset" (dict "type" .Values.resourcesPreset) | nindent 12 }}
          {{- end }}
          {{- if .Values.extraVolumeMounts }}
          volumeMounts:
          {{- if .Values.extraVolumeMounts }}
          {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 10 }}
          {{- end }}
          {{- end }}
        {{- if .Values.sidecars }}
        {{- include "common.tplvalues.render" ( dict "value" .Values.sidecars "context" $) | nindent 8 }}
        {{- end }}
      {{- if .Values.extraVolumes }}
      volumes:
      {{- if .Values.extraVolumes }}
      {{- include "common.tplvalues.render" (dict "value" .Values.extraVolumes "context" $) | nindent 6 }}
      {{- end }}
      {{- end }}
      restartPolicy: Always

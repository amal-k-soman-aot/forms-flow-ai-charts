apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "formsflow.names.fullname" . }}
  namespace: {{ include "formsflow.names.namespace" . | quote }}
  labels: {{- include "formsflow.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: forms-flow-api
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "formsflow.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  FORMSFLOW_API_PORT: "{{ .Values.database.port }}"
  FORMIO_JWT_EXPIRE: "{{ .Values.FormioJWTExpire }}"
{{- if not .Values.existingSecret }}
{{- $name := include "forms-flow-offline-worker.name" . }}
# Only the worker reads these. The signing key's public half is
# forms-flow-offline-worker.publicKey in chart forms-flow-ai (API, gateway, BPM check it).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "forms-flow-offline-worker.labels" (dict "name" $name "component" "offline-worker" "context" $) | nindent 4 }}
type: Opaque
stringData:
  # Secret of the Keycloak client forms-flow-offline-worker.clientid (forms-flow-ai).
  OFFLINE_WORKER_CLIENT_SECRET: {{ .Values.clientSecret | quote }}
  # RSA private key (PEM, line breaks as \n).
  OFFLINE_WORKER_SIGNING_KEY: {{ .Values.signingKey | quote }}
{{- end }}

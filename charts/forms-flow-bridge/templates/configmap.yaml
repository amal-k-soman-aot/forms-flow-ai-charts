{{- $name := include "forms-flow-bridge.name" . }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "forms-flow-bridge.labels" (dict "name" $name "component" "bridge" "context" $) | nindent 4 }}
data:
  NATS_USER: "offline-bridge"
  OFFLINE_BRIDGE_HTTP_PORT: {{ .Values.containerPorts.http | quote }}
  OFFLINE_BRIDGE_GRPC_PORT: {{ .Values.containerPorts.grpc | quote }}
  # The store user made for the bridge by forms-flow-objectstore-init.
  OFFLINE_STORE_ACCESS_KEY: "offline-bridge"
  JWT_OIDC_ALGORITHMS: "RS256"
  JWT_OIDC_JWKS_CACHE_TIMEOUT: "300"

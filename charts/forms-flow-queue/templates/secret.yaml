{{- if not .Values.existingSecret }}
{{- $name := include "forms-flow-queue.name" . }}
# The JetStream encryption key: only the queue reads it. Never lose or change
# it once forms are stored (they could not be read any more).
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "forms-flow-queue.labels" (dict "name" $name "component" "queue" "context" $) | nindent 4 }}
type: Opaque
stringData:
  JS_KEY: {{ required "jetstreamKey is required (openssl rand -hex 32)" .Values.jetstreamKey | quote }}
{{- end }}

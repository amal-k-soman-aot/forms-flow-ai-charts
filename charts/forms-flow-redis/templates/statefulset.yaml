apiVersion: {{ include "formsflow.capabilities.statefulset.apiVersion" . }}
kind: StatefulSet
metadata:
  name: {{ template "forms-flow-redis.fullname" . }}
  namespace: {{ include "formsflow.names.namespace" . | quote }}
  labels: {{- include "formsflow.labels.standard" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: forms-flow-redis
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "formsflow.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
spec:
  serviceName: {{ template "forms-flow-redis.fullname" . }}
  replicas: {{ .Values.replicaCount }}
  {{- $podLabels := include "formsflow.tplvalues.merge" ( dict "values" ( list .Values.podLabels .Values.commonLabels ) "context" . ) }}
  selector:
    matchLabels: {{- include "formsflow.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 6 }}
      app.kubernetes.io/component: forms-flow-redis
  template:
    metadata:
      labels: {{- include "formsflow.labels.standard" ( dict "customLabels" $podLabels "context" $ ) | nindent 8 }}
        app.kubernetes.io/component: forms-flow-redis
    spec:
      containers:
      - name: redis
        image: {{ include "forms-flow-redis.image" . }}
        imagePullPolicy: {{ .Values.image.pullPolicy | quote }}
        {{- if .Values.containerSecurityContext.enabled }}
        securityContext: {{- include "formsflow.compatibility.renderSecurityContext" (dict "secContext" .Values.containerSecurityContext "context" $) | nindent 12 }}
        {{- end }}
        {{- if .Values.diagnosticMode.enabled }}
        command: {{- include "formsflow.tplvalues.render" (dict "value" .Values.diagnosticMode.command "context" $) | nindent 12 }}
        {{- else if .Values.command }}
        command: {{- include "formsflow.tplvalues.render" (dict "value" .Values.command "context" $) | nindent 12 }}
        {{- end }}
        {{- if .Values.diagnosticMode.enabled }}
        args: {{- include "formsflow.tplvalues.render" (dict "value" .Values.diagnosticMode.args "context" $) | nindent 12 }}
        {{- else if .Values.args }}
        args: {{- include "formsflow.tplvalues.render" (dict "value" .Values.args "context" $) | nindent 12 }}
        {{- end }}
        {{- if .Values.lifecycleHooks }}
        lifecycle: {{- include "formsflow.tplvalues.render" (dict "value" .Values.lifecycleHooks "context" $) | nindent 12 }}
        {{- end }}
        env:
          - name: POD_IP
            valueFrom:
              fieldRef:
                fieldPath: status.podIP  
          {{- if .Values.extraEnvVars }}
          {{- include "formsflow.tplvalues.render" ( dict "value" .Values.extraEnvVars "context" $ ) | nindent 10 }}
          {{- end }}
        {{- if or .Values.extraEnvVarsCM .Values.extraEnvVarsSecret }}
        envFrom:
          {{- if .Values.extraEnvVarsCM }}
          - configMapRef:
              name: {{ include "formsflow.tplvalues.render" ( dict "value" .Values.extraEnvVarsCM "context" $ ) }}
          {{- end }}
          {{- if .Values.extraEnvVarsSecret }}
          - secretRef:
              name: {{ include "formsflow.tplvalues.render" ( dict "value" .Values.extraEnvVarsSecret "context" $ ) }}
          {{- end }}
        {{- end }}       
        ports:
        - containerPort: {{ .Values.containerPorts.client }}
          name: client
        - containerPort: {{ .Values.containerPorts.gossip }}
          name: gossip
        {{- if .Values.resources }}
        resources: 
          {{- toYaml .Values.resources | nindent 12 }}
        {{- else if ne .Values.resourcesPreset "none" }}
        resources: 
          {{- include "formsflow.resources.preset" (dict "type" .Values.resourcesPreset) | nindent 12 }}
        {{- end }}
        {{- if .Values.customLivenessProbe }}
        livenessProbe: {{- include "formsflow.tplvalues.render" (dict "value" .Values.customLivenessProbe "context" $) | nindent 12 }}
        {{- else if .Values.livenessProbe.enabled }}
        livenessProbe:
          initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          timeoutSeconds: {{ add1 .Values.livenessProbe.timeoutSeconds }}
          successThreshold: {{ .Values.livenessProbe.successThreshold }}
          failureThreshold: {{ .Values.livenessProbe.failureThreshold }}
          tcpSocket:
            port: client
        {{- end }}
        {{- if .Values.customReadinessProbe }}
        readinessProbe: {{- include "formsflow.tplvalues.render" (dict "value" .Values.customReadinessProbe "context" $) | nindent 12 }}
        {{- else if .Values.readinessProbe.enabled }}
        readinessProbe:
          initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
          periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          timeoutSeconds: {{ add1 .Values.readinessProbe.timeoutSeconds }}
          exec:
            command:
              - redis-cli
              - ping
        {{- end }}     
        volumeMounts:
        - mountPath: /conf
          name: conf
          readOnly: true
        - mountPath: /data
          name: redis-data
          readOnly: false
        {{- if .Values.extraVolumeMounts }}
        {{- include "formsflow.tplvalues.render" (dict "value" .Values.extraVolumeMounts "context" $) | nindent 12 }}
        {{- end }}
      {{- if .Values.sidecars }}
      {{- include "formsflow.tplvalues.render" ( dict "value" .Values.sidecars "context" $) | nindent 8 }}
      {{- end }}
      volumes:
      - configMap:
          defaultMode: 0555
          name: {{ include "forms-flow-redis.fullname" . }}
        name: conf
      {{- if .Values.extraVolumes }}
      {{- include "formsflow.tplvalues.render" (dict "value" .Values.extraVolumes "context" $) | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: redis-data
        labels: {{- include "formsflow.labels.matchLabels" ( dict "customLabels" .Values.commonLabels "context" $ ) | nindent 10 }}
          app.kubernetes.io/component: forms-flow-redis
        {{- if .Values.persistence.annotations }}
        annotations: {{- toYaml .Values.persistence.annotations | nindent 10 }}
        {{- end }}
      spec:
        storageClassName: {{ .Values.persistence.storageClass }}
        accessModes:
        {{- range .Values.persistence.accessModes }}
          - {{ . | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- if .Values.persistence.selector }}
        selector: {{- include "formsflow.tplvalues.render" ( dict "value" .Values.persistence.selector "context" $) | nindent 10 }}
        {{- end }}
  {{- end }}

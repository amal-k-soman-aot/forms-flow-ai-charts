
---
Domain: #<DEFINE_ME>
commonLabels: {}
formsflowdb:
  postgresql:
    fullnameOverride: forms-flow-ai-postgresql-ha-pgpool
    enabled: true
    database: postgres
  service:
    ports:
      postgresql: 5432
forms-flow-bpm:
  clientid: "forms-flow-bpm"
  clientsecret: "e4bdbd25-1467-4f7f-b993-bc4b1944c943"
  service:
    name: forms-flow-bpm
    port: "8080"
forms-flow-api:
  service:
    name: forms-flow-api
    port: "5000"
forms-flow-documents-api:
  service:
    name: forms-flow-documents-api
    port: "5006"
forms-flow-admin:
  service:
    name: forms-flow-admin
    port: "5000"
forms-flow-analytics:
  service:
    name: forms-flow-analytics
    port: "5000"
forms-flow-process-gateway:
  # The web app calls it at https://<forms-flow-web host><path>; the API,
  # admin and offline worker at the service below.
  path: /gatewayapi
  # Path prefix of the gateway's process API (BPM_API_URL_PREFIX).
  apiPrefix: /api/v1
  service:
    name: forms-flow-process-gateway
    port: "8000"
forms-flow-forms:
  admin:
    email: "me@defineme.com"
    password: "admin"
  service:
    name: forms-flow-forms
    port: "3001"
forms-flow-idm:
  keycloak:
    EnableKeycloakClientAuth: false
    ingress:
      hostname: forms-flow-idm-{{.Release.Namespace}}.{{tpl (.Values.Domain) .}}
  realm: forms-flow-ai
  context-path: /auth

forms-flow-web:
  EnableMultitenant: false
  clientid: forms-flow-web
  ingress:
      hostname: forms-flow-web-{{.Release.Namespace}}.{{tpl (.Values.Domain) .}}
  service:
    name: forms-flow-web
    port: "8080"
  # Offline forms in the web app (OFFLINE_ENABLED and OFFLINE_AUTO_SYNC_ENABLED
  # are also read by the API and the worker).
  offline:
    enabled: false
    # true if organizations may send forms without a click.
    autoSyncEnabled: false
    bundlesEnabled: false
    # Hours the app may open offline after the last online sign-in.
    maxHours: "24"
    # Network check (milliseconds; failed checks out of the last 5).
    network:
      goodMs: "300"
      slowMs: "1500"
      unstableFailures: "2"
      probeTimeoutMs: "6000"
    # Hours a sent form stays listed as confirmed on the device.
    confirmedKeptHours: "24"
    # Sent at once: form metadata, and form data (count and bytes).
    metadataBatchMaxBytes: "262144"
    metadataBatchMaxCount: "100"
    dataBatchMaxBytes: "2097152"
    dataBatchMaxCount: "10"

## Offline forms components. Each section holds the settings of one chart
## (forms-flow-queue, forms-flow-objectstore, forms-flow-bridge,
## forms-flow-edge, forms-flow-offline-worker, forms-flow-queue-ui) that other
## components also need; they are read from this chart's ConfigMap and Secret.
## Service names must match the charts' fullnameOverride.
## Generate the passwords and secrets with: openssl rand -hex 24
forms-flow-queue:
  service:
    name: forms-flow-queue
    port: "4222"
  # How long a failing form is retried, and how long a form that cannot be
  # saved yet waits (worker; checked by the object store init).
  maxHours: "24"
  maxWaitDays: "6"
  # Password of the queue's setup user (queue init).
  setupPassword: ""
forms-flow-objectstore:
  service:
    name: forms-flow-objectstore
    port: "9000"
  bucket: formsflow-offline
  region: us-east-1
  rootUser: offline-admin
  rootPassword: ""
forms-flow-bridge:
  # Its queue password and its object store secret.
  natsPassword: ""
  storeSecret: ""
  # The viewer's trace of each form (bridge and worker).
  traceEnabled: true
forms-flow-edge:
  # Public address of the edge for the web app. Empty: the web host plus
  # path (https://<forms-flow-web hostname>/envoy); path must match the
  # forms-flow-edge chart's ingress.path.
  url: ""
  path: /envoy
forms-flow-offline-worker:
  # The Keycloak client the worker signs in with (API, gateway, BPM check it).
  clientid: forms-flow-offline-worker
  # Change it when replacing the keys.
  keyId: offline-worker-1
  # Public half of the worker's signing key (PEM, line breaks as \n), checked
  # by the API, gateway and BPM. Empty: no "on behalf of" token is accepted.
  # The private half is the forms-flow-offline-worker chart's signingKey.
  publicKey: ""
  # Seconds of clock difference allowed for on-behalf tokens (gateway, BPM).
  onBehalfLeewayS: "30"
  # Redis that remembers used on-behalf tokens; needed when the gateway or
  # BPM runs more than one copy (e.g. redis://redis-exporter:6379/2).
  replayRedisUrl: ""
  # true only when a custom submission service accepts the worker's tokens.
  customSubmissionEnabled: false
  # Its queue password and its object store secret.
  natsPassword: ""
  storeSecret: ""
forms-flow-queue-ui:
  # Queue password of the viewer. Optional: empty and it cannot sign in.
  natsPassword: ""

imageCredentials:
  registry: quay.io
  username: "someone"
  password: "test"
  email: "someone@host.com"

## @param image.registry [default: REGISTRY_NAME] MongoDB(&reg;) image registry
## @param image.repository [default: REPOSITORY_NAME/mongodb] MongoDB(&reg;) image registry
## @skip image.tag MongoDB(&reg;) image tag (immutable tags are recommended)
## @param image.digest MongoDB(&reg;) image digest in the way sha256:aa.... Please note this parameter, if set, will override the tag
## @param image.pullPolicy MongoDB(&reg;) image pull policy
## @param image.pullSecrets Specify docker-registry secret names as an array
## @param image.debug Set to true if you would like to see extra information on logs
##
mongodb:
  global: 
    security: 
      allowInsecureImages: true
  image:
    registry: docker.io
    repository: bitnamilegacy/mongodb
    tag: 8.0.10-debian-12-r2 #4.2.21-debian-10-r8
    pullSecrets:
      - forms-flow-auth
  enabled: true
  ## @param fullnameOverride String to fully override mongodb.fullname template
  ##
  fullnameOverride: "forms-flow-ai-mongodb"
  ## @param clusterDomain Default Kubernetes cluster domain
  ##
  clusterDomain: cluster.local
  ## @param architecture MongoDB(&reg;) architecture (`standalone` or `replicaset`)
  ##
  architecture: replicaset
  ## @param useStatefulSet Set to true to use a StatefulSet instead of a Deployment (only when `architecture=standalone`)
  ##
  useStatefulSet: true
  ## MongoDB(&reg;) Authentication parameters
  ##
  auth:
    ## @param auth.enabled Enable authentication
    ## ref: https://docs.mongodb.com/manual/tutorial/enable-authentication/
    ##
    enabled: true
    ## MongoDB(&reg;) custom users and databases
    ## ref: https://github.com/bitnami/containers/tree/main/bitnami/mongodb#creating-a-user-and-database-on-first-run
    ## @param auth.usernames List of custom users to be created during the initialization
    ## @param auth.passwords List of passwords for the custom users set at `auth.usernames`
    ## @param auth.databases List of custom databases to be created during the initialization
    ##
    databases: 
      - formsflow 
    passwords:
      - changeme    #use the same password in initdbscript
    usernames:
      - mongodb     #use the same username in initdbscript
    ## @param auth.rootUser MongoDB(&reg;) root user
    ##
    rootUser: root
    ## @param auth.rootPassword MongoDB(&reg;) root password
    ## ref: https://github.com/bitnami/containers/tree/main/bitnami/mongodb#setting-the-root-user-and-password-on-first-run
    ##
    rootPassword: "changeme"
    ## @param auth.replicaSetKey Key used for authentication in the replicaset (only when `architecture=replicaset`)
    ##  
    replicaSetKey: "formsflow"
  # initdbScripts:
  #    init-mongo.js: |
  #          use admin
  #          db.createUser({
  #             user: 'mongodb',     
  #             pwd: 'changeme',   
  #             roles: [
  #               {
  #                  role: 'readWrite',
  #                  db: 'formsflow',
  #               },
  #             ],
  #          });
    options: "authMechanism=SCRAM-SHA-1&authSource=admin"
  ## @param replicaSetName Name of the replica set (only when `architecture=replicaset`)
  ## Ignored when mongodb.architecture=standalone
  ##
  replicaSetName: rs0
  ## @param replicaSetHostnames Enable DNS hostnames in the replicaset config (only when `architecture=replicaset`)
  ## Ignored when mongodb.architecture=standalone
  ## Ignored when externalAccess.enabled=true
  ##  
  replicaSetHostnames: true
  ## @param directoryPerDB Switch to enable/disable DirectoryPerDB on MongoDB(&reg;)
  ## ref: https://github.com/bitnami/containers/tree/main/bitnami/mongodb#enablingdisabling-directoryperdb
  ##  
  directoryPerDB: false
  ## @param replicaCount Number of MongoDB(&reg;) nodes
  ## When `mongodb.architecture=replicaset`, the number of replicas is taken in account
  ## When `mongodb.architecture=standalone`, the number of replicas can only be 0 or 1 (value higher then 1 will not be taken in account)
  ##
  replicaCount: 3
  ## MongoDB(&reg;) pods' Security Context.
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
  ## @param podSecurityContext.enabled Enable MongoDB(&reg;) pod(s)' Security Context
  ## @param podSecurityContext.fsGroupChangePolicy Set filesystem group change policy
  ## @param podSecurityContext.supplementalGroups Set filesystem extra groups
  ## @param podSecurityContext.fsGroup Group ID for the volumes of the MongoDB(&reg;) pod(s)
  ## @param podSecurityContext.sysctls sysctl settings of the MongoDB(&reg;) pod(s)'
  ##  
  podSecurityContext:
    enabled: false
    fsGroupChangePolicy: Always
    sysctls: []
    supplementalGroups: []
    fsGroup: 1001

  ## MongoDB(&reg;) containers' Security Context (main and metrics container).
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-container
  ## @param containerSecurityContext.enabled Enabled containers' Security Context
  ## @param containerSecurityContext.seLinuxOptions [object,nullable] Set SELinux options in container
  ## @param containerSecurityContext.runAsUser Set containers' Security Context runAsUser
  ## @param containerSecurityContext.runAsGroup Set containers' Security Context runAsGroup
  ## @param containerSecurityContext.runAsNonRoot Set container's Security Context runAsNonRoot
  ## @param containerSecurityContext.privileged Set container's Security Context privileged
  ## @param containerSecurityContext.readOnlyRootFilesystem Set container's Security Context readOnlyRootFilesystem
  ## @param containerSecurityContext.allowPrivilegeEscalation Set container's Security Context allowPrivilegeEscalation
  ## @param containerSecurityContext.capabilities.drop List of capabilities to be dropped
  ## @param containerSecurityContext.seccompProfile.type Set container's Security Context seccomp profile
  ##
  containerSecurityContext:
    enabled: false
    seLinuxOptions: {}
    runAsUser: 1001
    runAsGroup: 1001
    runAsNonRoot: true
    privileged: false
    readOnlyRootFilesystem: true
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: "RuntimeDefault"
  ## @param containerPorts.mongodb MongoDB(&reg;) container port
  ##
  containerPorts:
    mongodb: 27017
  ## @section Traffic exposure parameters
  ##

  ## Service parameters
  ##
  service:
    nameOverride: "forms-flow-ai-mongodb"
    type: ClusterIP
    portName: mongodb
    ports:
      mongodb: 27017

  persistence:
    enabled: true
    storageClass: ""
    accessModes:
      - ReadWriteOnce
    size: 8Gi
    mountPath: /bitnami/mongodb
  ## @section RBAC parameters
  ##

  ## ServiceAccount
  ## ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
  ##
  serviceAccount:
    create: true
  ## @section Arbiter parameters
  ##
  arbiter:
    enabled: false
    podSecurityContext:
      enabled: false
      fsGroup: 1001
    containerSecurityContext:
      enabled: false
      runAsUser: 1001


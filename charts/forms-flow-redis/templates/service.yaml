apiVersion: v1
kind: Service
metadata:
  name: {{ include "forms-flow-redis.fullname" . }}
  namespace: {{ include "formsflow.names.namespace" . | quote }}
  {{- $versionLabel := dict "app.kubernetes.io/version" ( include "formsflow.images.version" ( dict "imageRoot" .Values.image "chart" .Chart ) ) }}
  {{- $labels := include "formsflow.tplvalues.merge" ( dict "values" ( list .Values.serviceLabels .Values.commonLabels $versionLabel ) "context" . ) }}
  labels: {{- include "formsflow.labels.standard" ( dict "customLabels" $labels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: forms-flow-redis  
  {{- if  .Values.serviceAnnotations }}
  {{- $annotations := include "formsflow.tplvalues.merge" ( dict "values" ( list .Values.serviceAnnotations .Values.commonAnnotations ) "context" . ) }}
  annotations: {{- include "formsflow.tplvalues.render" ( dict "value" $annotations "context" $) | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if or (eq .Values.service.type "LoadBalancer") (eq .Values.service.type "NodePort") }}
  externalTrafficPolicy: {{ .Values.service.externalTrafficPolicy | quote }}
  {{- end }}
  {{- if (semverCompare ">=1.22-0" (include "formsflow.capabilities.kubeVersion" .)) }}
  internalTrafficPolicy: {{ .Values.service.internalTrafficPolicy }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") (not (empty .Values.service.loadBalancerIP)) }}
  loadBalancerIP: {{ .Values.service.loadBalancerIP }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer")  .Values.service.loadBalancerClass }}
  loadBalancerClass: {{ .Values.service.loadBalancerClass }}
  {{- end }}
  {{- if and (eq .Values.service.type "LoadBalancer") (not (empty .Values.service.loadBalancerSourceRanges)) }}
  loadBalancerSourceRanges: {{ toYaml .Values.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if and .Values.service.clusterIP (eq .Values.service.type "ClusterIP") }}
  clusterIP: {{ .Values.service.clusterIP }}
  {{- end }}
  {{- if .Values.service.sessionAffinity }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- end }}
  {{- if .Values.service.sessionAffinityConfig }}
  sessionAffinityConfig: {{- include "formsflow.tplvalues.render" (dict "value" .Values.service.sessionAffinityConfig "context" $) | nindent 4 }}
  {{- end }}
  {{- if .Values.service.externalIPs }}
  externalIPs: {{- include "formsflow.tplvalues.render" (dict "value" .Values.service.externalIPs "context" $) | nindent 4 }}
  {{- end }}
  ports:
  - name: {{ .Values.service.portNames.redis }}
    port: {{ .Values.service.ports.redis }}
    targetPort: 6379
  - name: {{ .Values.service.portNames.redis2 }}
    port: {{ .Values.service.ports.redis2 }}
    targetPort: 16379  
    {{- if and (or (eq .Values.service.type "NodePort") (eq .Values.service.type "LoadBalancer")) .Values.service.nodePorts.redis}}
    nodePort: {{ .Values.service.nodePorts.redis}}
    {{- else if eq .Values.service.type "ClusterIP" }}
    nodePort: null
    {{- end }}
  {{- if .Values.service.extraPorts }}
  {{- include "formsflow.tplvalues.render" (dict "value" .Values.service.extraPorts "context" $) | nindent 4 }}
  {{- end }}
  {{- $podLabels := include "formsflow.tplvalues.merge" ( dict "values" ( list .Values.podLabels .Values.commonLabels ) "context" . ) }}
  selector: {{- include "formsflow.labels.matchLabels" ( dict "customLabels" $podLabels "context" $ ) | nindent 4 }}
    app.kubernetes.io/component: forms-flow-redis
